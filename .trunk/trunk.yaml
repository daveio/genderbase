# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - ruby@3.4.5
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    - osv-scanner
    - prettier
    - sort-package-json
    - semgrep
    - terrascan
    - eslint
    - vale
    - djlint
    - markdown-table-prettify
    - markdownlint
    - remark-lint
  definitions:
    - name: rails-test
      files:
        - ALL
      commands:
        - name: rails-test
          output: pass_fail
          run: bin/rails test
          success_codes: [0, 1]
  ignore:
    - linters:
        - trunk-toolbox
      paths:
        - "**/*.jpg"
        - "**/*.png"
        - "**/*.html"
    - linters:
        - prettier
      paths:
        - "**/*.js"
        - "**/*.mjs"
        - "**/*.json"
        - "**/*.css"
    - linters:
        - shellcheck
      paths:
        - bin/docker-entrypoint
    - linters:
        - ALL
      paths:
        - bin/mise
        - "**/*.zst"
        - .idea/**
        - .serena/**
  enabled:
    - grype@0.118.0
    - pinact@4.1.1
    - trunk-toolbox@0.7.0
    - stylelint@17.14.1
    - markdownlint-cli2@0.23.2
    - biome@2.5.11
    - dustilock@1.2.0
    - gitleaks@8.30.1
    - markdown-link-check@3.15.0
    - taplo@0.10.0
    - actionlint@1.7.12
    - brakeman
    - checkov@3.3.15
    - git-diff-check
    - hadolint@2.15.1
    - oxipng@10.2.0
    - rubocop:
        packages:
          - rubocop-capybara
          - rubocop-minitest
          - rubocop-performance
          - rubocop-rails
          - rubocop-rails-omakase
          - rubocop-rake
          - rubocop-rspec
          - rubocop-sorbet
          - rubocop-thread_safety
    - shellcheck@0.11.0
    - shfmt@3.14.0
    - svgo@4.1.0
    - trufflehog@3.97.1
    - yamllint@1.38.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
    - trunk-cache-prune
    - git-lfs
    - rails-test
  definitions:
    - id: rails-test
      display_name: Rails Test
      run: bin/rails test
      triggers:
        - git_hooks:
            - pre-commit
